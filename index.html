<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To-Do List</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: Arial, Helvetica, sans-serif;
  min-height: 100vh;
  background: linear-gradient(115deg, #0a1c5b 0%, #23105e 55%, #5d0f8b 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem;
}
.page { display: flex; align-items: center; gap: 5rem; flex-wrap: wrap; justify-content: center; }
.card {
  background: #fff;
  width: 400px;
  max-width: 90vw;
  border-radius: 12px;
  padding: 28px 28px 36px;
}
.card h1 { color: #002765; font-size: 1.4rem; margin-bottom: 1.2rem; }
.row { display: flex; align-items: center; margin-bottom: 1.4rem; }
.row input {
  flex: 1;
  border: none;
  outline: none;
  background: #f1f1f1;
  border-radius: 999px;
  padding: 0.9rem 1.2rem;
  font-size: 0.9rem;
}
.row button {
  border: none;
  cursor: pointer;
  background: #ff5945;
  color: #fff;
  font-weight: bold;
  border-radius: 999px;
  padding: 0.9rem 2.2rem;
  margin-left: -3.2rem;
}
ul { list-style: none; }
li {
  display: flex;
  align-items: center;
  gap: 0.8rem;
  padding: 0.55rem 0.2rem;
  font-size: 0.92rem;
  color: #222;
}
.check {
  width: 22px;
  height: 22px;
  min-width: 22px;
  border: 2px solid #ddd;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 0.8rem;
  background: #fff;
}
li.completed .check { background: #ff5945; border-color: #ff5945; }
li.completed .label { text-decoration: line-through; color: #bbb; }
.label { flex: 1; cursor: pointer; }
.del { border: none; background: none; cursor: pointer; color: #888; font-size: 1.1rem; }
.del:hover { color: #ff5945; }
.hero { color: #fff; line-height: 1.1; }
.hero .big { font-size: 4.5rem; font-weight: 800; }
.hero .accent { color: #ff5945; }
.hero .sub { font-size: 2.2rem; font-weight: 700; margin-top: 0.6rem; }
@media (max-width: 900px) {
  .hero .big { font-size: 3rem; }
  .hero .sub { font-size: 1.5rem; }
  .page { gap: 2rem; }
}
</style>
</head>
<body>
<div class="page">
  <div class="card">
    <h1>To-Do List 📝</h1>
    <div class="row">
      <input id="newTitle" placeholder="Add your task" />
      <button onclick="addTask()">ADD</button>
    </div>
    <ul id="tasks"></ul>
  </div>
  <div class="hero">
    <div class="big">Build</div>
    <div class="big"><span class="accent">To-Do</span> List</div>
    <div class="sub">With JavaScript</div>
  </div>
</div>
<script>
async function fetchTasks() {
  const res = await fetch("/api/tasks");
  const tasks = await res.json();
  const list = document.getElementById("tasks");
  list.innerHTML = "";
  tasks.forEach(t => {
    const li = document.createElement("li");
    if (t.completed) li.className = "completed";
    const check = document.createElement("div");
    check.className = "check";
    check.textContent = t.completed ? "✔" : "";
    check.onclick = () => updateTask(t.id, { completed: !t.completed });
    const label = document.createElement("span");
    label.className = "label";
    label.textContent = t.title;
    label.title = "Double-click to edit";
    label.ondblclick = () => {
      const title = prompt("Edit task", t.title);
      if (title && title.trim()) updateTask(t.id, { title: title.trim() });
    };
    const del = document.createElement("button");
    del.className = "del";
    del.textContent = "×";
    del.onclick = () => deleteTask(t.id);
    li.append(check, label, del);
    list.appendChild(li);
  });
}
async function addTask() {
  const input = document.getElementById("newTitle");
  if (!input.value.trim()) return;
  await fetch("/api/tasks", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ title: input.value.trim() })
  });
  input.value = "";
  fetchTasks();
}
async function updateTask(id, data) {
  await fetch("/api/tasks/" + id, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data)
  });
  fetchTasks();
}
async function deleteTask(id) {
  await fetch("/api/tasks/" + id, { method: "DELETE" });
  fetchTasks();
}
document.getElementById("newTitle").addEventListener("keydown", e => {
  if (e.key === "Enter") addTask();
});
fetchTasks();
</script>
</body>
</html>
